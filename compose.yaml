services:
  database:
    image: postgres:16-alpine
    container_name: express_contactos_db
    environment:
      POSTGRES_DB: express_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
